# Continuous fuzzing for Physical AI Runtime
#
# Trigger matrix
# --------------
#   schedule        Weekly Monday 02:00 UTC — full campaign (120 s/target default)
#   workflow_dispatch  Manual run with configurable duration
#   pull_request    Short smoke run (30 s/target) on inference/runtime changes
#
# Each harness runs in its own matrix job so they execute in parallel.
# Crashes and fuzzer output are uploaded as artifacts.
# The corpus directory is seeded from tests/fuzz/seeds/ when available;
# otherwise each run starts cold.  For the 30–120 s budgets used here
# a cold start loses ~15 s of exploration vs a warm corpus, which is not
# worth the cache management overhead.
#
# Fuzzing duration ladder
#   pull_request  → 30 s   (quick sanity check, no regression)
#   scheduled     → 120 s  (weekly campaign)
#   manual        → value of duration_s input (default 300 s)
#   push/fuzz     → 300 s  (same as manual default; temporary branch for testing)

name: Fuzz

on:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC
  # Temporary: push to the fuzz branch triggers a full manual-equivalent run
  # (300 s/target).  Remove this trigger once testing is complete.
  push:
    branches:
      - fuzz
  workflow_dispatch:
    inputs:
      duration_s:
        description: "Fuzzing duration per target (seconds)"
        default: "300"
        required: false
  pull_request:
    paths:
      - "tests/fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions: {} # deny all by default; each job grants only what it needs

jobs:
  fuzz:
    name: "fuzz / ${{ matrix.harness }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Manifest / component instantiation
          - harness: manifest
            seed_dir: tests/fuzz/seeds/manifest
          - harness: component
            seed_dir: ""
          # Array processing pipeline
          - harness: stats_normalizer
            seed_dir: ""
          - harness: stats_denormalizer
            seed_dir: ""
          - harness: resize_preprocessor
            seed_dir: ""
          - harness: action_normalizer
            seed_dir: ""
          - harness: action_chunk_trimmer
            seed_dir: ""
          - harness: lerp_smoother
            seed_dir: ""
          - harness: resize_smolvla
            seed_dir: ""
          # Path handling, runtime, queue
          - harness: policy_name
            seed_dir: ""
          - harness: detect_backend
            seed_dir: ""
          - harness: prepare_inputs
            seed_dir: ""
          - harness: action_queue
            seed_dir: ""
          - harness: import_dotted_path
            seed_dir: ""

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.8"

      - name: Install project dependencies
        run: uv sync --frozen

      # TODO: move atheris into pyproject.toml [project.optional-dependencies] fuzz
      #       group and switch to `uv sync --frozen --extra fuzz` so the version
      #       is lockfile-managed.  Needs `uv lock` refresh after the change.
      - name: Install atheris
        run: uv pip install "atheris==3.1.0"

      - name: Seed corpus
        run: |
          mkdir -p "tests/fuzz/corpus/${{ matrix.harness }}"
          if [ -n "${{ matrix.seed_dir }}" ] && [ -d "${{ matrix.seed_dir }}" ]; then
            cp -rn "${{ matrix.seed_dir }}/." "tests/fuzz/corpus/${{ matrix.harness }}/" || true
          fi

      # ── Fuzzing run ───────────────────────────────────────────────────────
      - name: Run fuzzer
        id: run_fuzzer
        env:
          # Duration ladder: PR=30s, push/fuzz=300s, scheduled=120s, manual=input value
          FUZZ_DURATION: >-
            ${{
              github.event_name == 'pull_request' && '30' ||
              github.event_name == 'push' && '300' ||
              github.event.inputs.duration_s || '120'
            }}
          # Emit a Python traceback on segfault/abort in native extensions
          # (cv2, onnxruntime, openvino) so crashes are diagnosed from logs.
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          uv run python "tests/fuzz/harnesses/fuzz_${{ matrix.harness }}.py" \
            "tests/fuzz/corpus/${{ matrix.harness }}/" \
            -max_total_time="${FUZZ_DURATION}" \
            -max_len=65536 \
            -timeout=30 \
            -rss_limit_mb=2048 \
            -print_final_stats=1 \
            2>&1 | tee "fuzz_output_${{ matrix.harness }}.txt"
        timeout-minutes: 15

      # ── Crash detection ───────────────────────────────────────────────────
      # libFuzzer writes four artifact types to the working directory:
      #   crash-*      uncaught exception or assert
      #   timeout-*    single input exceeded -timeout
      #   oom-*        process exceeded -rss_limit_mb
      #   slow-unit-*  input exceeded report_slow_units threshold
      - name: Detect crashes
        if: always()
        id: crash_check
        run: |
          mapfile -t crashes < <(find . -maxdepth 1 \
            \( -name 'crash-*' -o -name 'timeout-*' \
               -o -name 'oom-*' -o -name 'slow-unit-*' \) \
            -print)
          if [ ${#crashes[@]} -gt 0 ]; then
            echo "crashes_found=true" >> "$GITHUB_OUTPUT"
            printf '::error::Crash artifacts found for %s:\n' "${{ matrix.harness }}"
            printf '  %s\n' "${crashes[@]}"
          else
            echo "crashes_found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Artifact uploads ──────────────────────────────────────────────────
      # Clean run      → zero artifacts.
      # libFuzzer crash → crash artifact (reproducing inputs + log).
      # Startup failure → diagnostic log (fuzzer exited non-zero, no crash files written;
      #                   happens for import errors, NameError at module level, etc.).
      - name: Upload crash artifacts
        if: ${{ always() && steps.crash_check.outputs.crashes_found == 'true' }}
        id: upload_crashes
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: crashes-${{ matrix.harness }}-${{ github.run_id }}
          path: |
            crash-*
            timeout-*
            oom-*
            slow-unit-*
            fuzz_output_${{ matrix.harness }}.txt
          if-no-files-found: warn
          retention-days: 90

      # Upload the log when useful for diagnosis: startup failure only.
      # libFuzzer crash already bundles the log in the crash artifact above.
      - name: Upload diagnostic log
        if: >-
          ${{    
            always() &&
            steps.crash_check.outputs.crashes_found != 'true' &&
            steps.run_fuzzer.conclusion == 'failure'
          }}
        id: upload_log_diagnostic
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: log-${{ matrix.harness }}-${{ github.run_id }}
          path: fuzz_output_${{ matrix.harness }}.txt
          if-no-files-found: warn
          retention-days: 14

      # ── Job summary ───────────────────────────────────────────────────────
      # Three tiers:
      #   ✅  clean run
      #   CAUTION  libFuzzer crash → artifact link
      #   CAUTION  startup failure (non-zero exit, no crash files) → log link
      - name: Write job summary
        if: always()
        env:
          CRASHES_FOUND:       ${{ steps.crash_check.outputs.crashes_found }}
          FUZZER_CONCLUSION:   ${{ steps.run_fuzzer.conclusion }}
          CRASH_ARTIFACT_ID:   ${{ steps.upload_crashes.outputs.artifact-id }}
          LOG_ARTIFACT_ID:     ${{ steps.upload_log_diagnostic.outputs.artifact-id }}
        run: |
          LOG="fuzz_output_${{ matrix.harness }}.txt"
          new_units="-"
          exec_per_s="-"
          if [ -f "${LOG}" ]; then
            new_units=$(awk '/stat::new_units_added/{print $NF}'       "${LOG}")
            exec_per_s=$(awk '/stat::average_exec_per_sec/{print $NF}'  "${LOG}")
          fi

          {
            if [ "${CRASHES_FOUND}" == "true" ]; then
              echo "> [!CAUTION]"
              echo "> **fuzz / ${{ matrix.harness }}** \u2014 crashes detected."
              if [ -n "${CRASH_ARTIFACT_ID}" ]; then
                echo "> Crash inputs + traceback: \`crashes-${{ matrix.harness }}-${{ github.run_id }}\`"
              else
                echo "> Crash files detected but upload failed \u2014 check the job log."
              fi
            elif [ "${FUZZER_CONCLUSION}" == "failure" ]; then
              echo "> [!CAUTION]"
              echo "> **fuzz / ${{ matrix.harness }}** \u2014 fuzzer exited non-zero but wrote no crash files."
              echo "> This is a **startup failure**: the harness crashed before libFuzzer initialised"
              echo "> (common causes: ImportError, NameError, SyntaxError at module level)."
              if [ -n "${LOG_ARTIFACT_ID}" ]; then
                echo "> Log: \`log-${{ matrix.harness }}-${{ github.run_id }}\`"
              fi
            elif [ ! -f "${LOG}" ]; then
              echo "> [!WARNING]"
              echo "> **fuzz / ${{ matrix.harness }}** \u2014 log file missing; runner may have timed out."
            else
              echo "\u2705 **fuzz / ${{ matrix.harness }}** \u2014 ${new_units} new corpus inputs \u00b7 ${exec_per_s} exec/s"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # ── Fail the job ──────────────────────────────────────────────────────
      # Fails for both libFuzzer crashes (crash files written) and startup
      # failures (fuzzer exited non-zero, no crash files).
      - name: Fail on crashes or startup failure
        if: ${{ always() && (steps.run_fuzzer.conclusion == 'failure' || steps.crash_check.outputs.crashes_found == 'true') }}
        run: |
          if [ "${{ steps.crash_check.outputs.crashes_found }}" == "true" ]; then
            echo "::error::Crashes detected in ${{ matrix.harness }} — see crash artifacts"
          else
            echo "::error::Fuzzer exited non-zero without crash files in ${{ matrix.harness }} — startup failure, see diagnostic log"
          fi
          exit 1
