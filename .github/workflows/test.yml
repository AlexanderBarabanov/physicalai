# Manual comparison: summarize a model card into a catalog highlight with several small local LLMs (llama.cpp).
# Testing only: models and llama.cpp are downloaded unpinned and unverified, so do not reuse this for anything trusted.

name: Local LLM summarization test

on: [workflow_dispatch]

permissions: {}

env:
  LLAMA_CPP_TAG: b12110
  LLAMA_CPP_ASSET: llama-b12110-bin-ubuntu-x64.tar.gz

jobs:
  summarize:
    name: "summarize / ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen3-4b-instruct-2507
            repo: unsloth/Qwen3-4B-Instruct-2507-GGUF
            file: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          - name: gemma-3-4b-it
            repo: unsloth/gemma-3-4b-it-GGUF
            file: gemma-3-4b-it-Q4_K_M.gguf
          - name: llama-3.2-3b-instruct
            repo: unsloth/Llama-3.2-3B-Instruct-GGUF
            file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - name: phi-3.5-mini-instruct
            repo: bartowski/Phi-3.5-mini-instruct-GGUF
            file: Phi-3.5-mini-instruct-Q4_K_M.gguf
    env:
      MODEL_NAME: ${{ matrix.name }}
      MODEL_REPO: ${{ matrix.repo }}
      MODEL_FILE_NAME: ${{ matrix.file }}
      PROMPT_FILE: prompt.md
      INPUT_FILE: .github/test_input/test.md
      OUT_DIR: llm-summary

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch llama.cpp and model
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/llm/llama-cpp"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/llm/llama.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/${LLAMA_CPP_ASSET}"
          tar -xzf "${RUNNER_TEMP}/llm/llama.tar.gz" -C "${RUNNER_TEMP}/llm/llama-cpp"
          server="$(find "${RUNNER_TEMP}/llm/llama-cpp" -name llama-server -type f | head -n 1)"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/llm/model.gguf" \
            "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE_NAME}"
          {
            echo "LLAMA_SERVER=${server}"
            echo "MODEL_FILE=${RUNNER_TEMP}/llm/model.gguf"
          } >> "$GITHUB_ENV"

      - name: Start llama-server on loopback
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(dirname "${LLAMA_SERVER}"):${LD_LIBRARY_PATH:-}"
          chmod +x "${LLAMA_SERVER}"
          SECONDS=0
          nohup "${LLAMA_SERVER}" -m "${MODEL_FILE}" --host 127.0.0.1 --port 8080 -c 8192 -np 1 -t "$(nproc)" \
            > "${RUNNER_TEMP}/llama-server.log" 2>&1 &
          echo "LLAMA_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "LOAD_S=${SECONDS}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::llama-server did not become healthy"
          tail -n 50 "${RUNNER_TEMP}/llama-server.log"
          exit 1

      - name: Summarize input
        run: |
          mkdir -p "${OUT_DIR}"
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from pathlib import Path

          out_dir = Path(os.environ["OUT_DIR"])
          prompt = Path(os.environ["PROMPT_FILE"]).read_text(encoding="utf-8")
          card = Path(os.environ["INPUT_FILE"]).read_text(encoding="utf-8")
          body = {
              "messages": [{"role": "user", "content": prompt.replace("{model_card}", card)}],
              "response_format": {"type": "json_object"},
              "temperature": 0,
              "max_tokens": 256,
          }
          request = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
          )
          start = time.monotonic()
          with urllib.request.urlopen(request, timeout=600) as response:  # noqa: S310
              reply = json.load(response)
          gen_s = time.monotonic() - start
          content = reply["choices"][0]["message"]["content"]
          (out_dir / "response.json").write_text(content, encoding="utf-8")

          result = {
              "name": os.environ["MODEL_NAME"],
              "file": os.environ["MODEL_FILE_NAME"],
              "load_s": float(os.environ["LOAD_S"]),
              "generation_s": round(gen_s, 1),
              "completion_tokens": (reply.get("usage") or {}).get("completion_tokens"),
              "highlight": None,
              "words": 0,
              "error": None,
          }
          try:
              result["highlight"] = json.loads(content)["highlight"]
          except (json.JSONDecodeError, KeyError, TypeError) as error:
              result["error"] = f"invalid JSON: {error}"
          if isinstance(result["highlight"], str):
              result["words"] = len(result["highlight"].split())
          (out_dir / "result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")

          print(content)
          if result["error"]:
              print(f"::error::{result['error']}")
              sys.exit(1)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-summary-${{ matrix.name }}
          path: llm-summary/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop llama-server
        if: always()
        run: |
          if [ -n "${LLAMA_PID:-}" ]; then
            kill "${LLAMA_PID}" 2>/dev/null || true
          fi

  report:
    name: Compare results
    needs: summarize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: llm-summary-*
          path: results

      - name: Write comparison to summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          rows = sorted(
              (json.loads(path.read_text(encoding="utf-8")) for path in Path("results").glob("*/result.json")),
              key=lambda item: item["name"],
          )
          print("### Model highlight comparison")
          print()
          print("| Model | Words | Load (s) | Generation (s) | Tokens | Highlight |")
          print("| --- | --- | --- | --- | --- | --- |")
          for row in rows:
              text = row["error"] or str(row["highlight"])
              text = text.replace("|", "\\|").replace("\n", " ")
              print(
                  f"| `{row['name']}` | {row['words']} | {row['load_s']:.0f} | {row['generation_s']} "
                  f"| {row['completion_tokens']} | {text} |"
              )
          print()
          print("Target: 15-25 words, maximum 30.")
          PY
